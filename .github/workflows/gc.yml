# Garbage collection for the Hestia binary cache used in check.yml.
#
# Must run on the default branch: a PR job's cache scope is read-only
# towards the default branch and dies with the PR, but the default-branch
# scope grows forever without GC.

name: Cache GC

concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: Mic92/hestia@v3
        with:
          # Token-capture-only mode: no daemon, just the cache API tokens.
          version: ""
      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
